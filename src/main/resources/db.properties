# Oracle connection. Defaults match sql/1_create_user.sql.
db.driver=oracle.jdbc.OracleDriver

# Oracle 10g / 11g Express Edition (SID = XE):
db.url=jdbc:oracle:thin:@localhost:1521:XE
# Oracle 18c / 21c Express Edition: comment the line above and use this one instead:
# db.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1

db.user=library
db.password=library123

# Library rules
loan.days=14
fine.per.day=5

# Max books a member can hold at once
max.loans=5

# true: the error page shows the technical cause (useful while developing).
# Set to false before showing the site to other people.
show.errors=true
